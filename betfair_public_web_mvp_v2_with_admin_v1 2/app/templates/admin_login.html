<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Admin Login</title><link rel="stylesheet" href="/static/admin.css"></head><body class="loginbody"><div class="loginbox"><div class="logo">B</div><h1>Data Manager</h1><p>Private administration</p><input id="pw" type="password" placeholder="Admin password"><button id="login">Sign in</button><div id="err"></div></div><script>async function go(){let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:document.getElementById("pw").value})});if(r.ok)location="/admin";else{let j=await r.json();document.getElementById("err").textContent=j.detail||"Login failed"}}document.getElementById("login").onclick=go;document.getElementById("pw").onkeydown=e=>{if(e.key==="Enter")go()}</script></body></html>
